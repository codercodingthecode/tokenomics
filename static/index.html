<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" id="themeMeta" content="#07090c">
<title>tokenomics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233b8efb' d='M12 2 3 7v10l9 5 9-5V7l-9-5Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>

<header class="topbar">
  <div class="tb-brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.7 3.7L12 11.7 5.3 8 12 4.3ZM5 9.7l6 3.3v6.6l-6-3.3V9.7Zm14 0v6.6l-6 3.3V13l6-3.3Z"/></svg>
    </span>
    <span class="wordmark">tokenomics</span>
  </div>
  <span class="tb-src"><span id="srcLabel"></span><span class="sep" id="srcSep" hidden> &middot; </span><span class="model" id="model"></span></span>
  <div class="tb-spacer"></div>
  <span class="tb-live" id="liveStatus"><span class="dot" id="liveDot"></span><span id="liveText">connecting</span></span>
  <span class="vllm-pill" id="vllmPill"><span id="vllmPillText">checking&hellip;</span><button type="button" class="vllm-btn" id="vllmBtn" hidden>Restart&hellip;</button></span>
  <div class="seg" id="range" role="group" aria-label="Range">
    <button type="button" data-min="15" class="on" aria-pressed="true">15 min</button>
    <button type="button" data-min="60" aria-pressed="false">1 h</button>
    <button type="button" data-min="360" aria-pressed="false">6 h</button>
    <button type="button" data-min="1440" aria-pressed="false">24 h</button>
    <button type="button" data-min="10080" aria-pressed="false">7 d</button>
  </div>
  <button type="button" class="theme-btn" id="themeBtn" title="theme: dark" aria-label="Change theme (dark, amber, light)">
    <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8Z"/></svg>
    <svg class="i-flame" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12.9 2c.6 2.7-.4 4.4-1.8 5.9C9.4 9.6 7.7 11.2 7.7 14A5.5 5.5 0 0 0 13 22a5.3 5.3 0 0 0 5.3-5.4c0-3.7-2.4-5.7-3.6-8.5-.5 1-1.2 1.7-2.1 2.1.4-2.1.8-4.3.3-8.2Zm.1 12.3c1.2.9 1.8 1.8 1.8 2.9a2.2 2.2 0 1 1-4.4 0c0-1.3 1-2 2.6-2.9Z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0-15 1 3h-2l1-3Zm0 20-1-3h2l-1 3ZM2 12l3-1v2l-3-1Zm20 0-3 1v-2l3 1ZM5 5l2.5 1.5L6 8 5 5Zm14 14-2.5-1.5L18 16l1 3Zm0-14-1 3-1.5-1.5L19 5ZM6.5 19.5 8 18l1.5 1.5L6.5 19.5Z"/></svg>
  </button>
</header>

<main>
  <div id="err" class="err" role="status" hidden></div>

  <!-- 1. what is the server doing right now: pipeline + throughput -->
  <section class="s1" aria-label="What is the server doing right now">
    <div class="sec-title">
      <h2>What is the server doing right now?</h2>
      <span class="sec-meta" id="rangeMeta"></span>
    </div>
    <p class="sec-sentence" id="summary"></p>
    <div class="pipeline" id="pipeline"></div>
    <div class="main-chart">
      <div class="mc-notes" id="mcNotes"></div>
      <div class="mc-plot" id="mcPlot"></div>
      <div class="mc-x" id="mcX"></div>
      <div class="mc-legend">
        <span><i class="sw line"></i>generation tok/s</span>
        <span><i class="sw dash"></i><span id="avgLegend">2-minute average</span></span>
      </div>
    </div>
  </section>

  <!-- 2. what is each request doing: gateway observer (hidden until /api/gw_live answers) -->
  <section class="s2" id="s2" aria-label="What is each request doing" hidden>
    <div class="sec-title">
      <h2>What is each request doing?</h2>
      <span id="gwStatus"></span>
    </div>
    <p class="sec-sentence gw-summary" id="gwSummary"></p>
    <div class="gw-wrap gw-scroll" id="gwLiveWrap">
      <div class="gw-table" id="gwLive"></div>
    </div>
    <div class="gw-recent-head"><span class="t">Just finished</span><span class="s" id="gwRecentSub"></span></div>
    <div class="gw-wrap gw-recent-wrap gw-scroll" id="gwRecentWrap">
      <div class="gw-table" id="gwRecent"></div>
    </div>
  </section>

  <!-- 3. kv cache + hardware side by side -->
  <section class="s3" id="s3" aria-label="KV cache and hardware">
    <div class="s3-col" id="kvCol">
      <h2>Is the KV cache earning its keep?</h2>
      <p class="col-sentence" id="kvSentence"></p>
      <div class="kv-tiers" id="kvTiers"></div>
      <div class="kv-hero" id="kvHero"></div>
      <div class="kv-mini" id="kvMini"></div>
    </div>
    <div class="s3-col" id="hwCol">
      <h2>Is the hardware OK?</h2>
      <p class="col-sentence" id="hwSentence"></p>
      <div class="hw-grid hw-scale" id="hwScale"></div>
      <div id="hwRows"></div>
      <p class="hw-note" id="hwNote"></p>
    </div>
  </section>

  <!-- 4. was it worth running it yourself -->
  <section class="s4" aria-label="Was it worth running it yourself">
    <div class="sec-title">
      <h2>Was it worth running it yourself?</h2>
      <div class="seg scope-seg" id="scope" role="group" aria-label="Scope">
        <button type="button" data-scope="total" class="on" aria-pressed="true">All time</button>
        <button type="button" data-scope="session" aria-pressed="false">This deployment</button>
      </div>
    </div>
    <div class="s4-grid">
      <div class="s4-left" id="ecoLeft"></div>
      <div class="s4-right" id="ledgerCol"></div>
    </div>
    <div class="s4-totals" id="s4Totals"></div>
  </section>
</main>

<footer id="footer"></footer>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
